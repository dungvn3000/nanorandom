<title>NanoRandom — Simple BIP39 Generator</title>

    <h1>Simple BIP39 Seed Generator</h1>
    <div class="row">
        <select id="wc" aria-label="Word count">
            <option value="12" selected>12 words</option>
            <option value="15">15 words</option>
            <option value="18">18 words</option>
            <option value="24">24 words</option>
        </select>
        <button id="gen" type="button">Generate</button>

    <div class="grid" id="grid"></div>
    <div class="ent">Entropy: <span id="ent">—</span></div>
    <p class="note">
        One file, no network, no tracking &mdash; entropy comes only from your browser's Web Crypto
        CSPRNG (the standard way wallets derive BIP39 seeds). Write the phrase down on paper and keep
        it offline. Anyone with these words owns the wallet.

async function sha256(bytes) {
    const buf = new Uint8Array(bytes).buffer;
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash));
}

function bytesToHex(bytes) {
    return bytes.map(b => b.toString(16).padStart(2, '0')).join('');
}

function toBits(bytes) {
    return bytes.map(b => b.toString(2).padStart(8, '0')).join('');
}

// BIP39: checksum = ENT/32 bits of SHA-256(entropy), then 11-bit word indices
async function entropyToMnemonic(entropyBytes) {
    const csLen = (entropyBytes.length * 8) / 32;
    const hashBytes = await sha256(entropyBytes);
    const allBits = toBits(entropyBytes) + toBits(hashBytes).slice(0, csLen);
    const words = [];
    for (let i = 0; i + 11 <= allBits.length; i += 11) {
        words.push(WORDLIST[parseInt(allBits.slice(i, i + 11), 2)]);
    }
    return words;
}

/* UI */
const wcEl  = document.getElementById('wc');
const grid  = document.getElementById('grid');
const entEl = document.getElementById('ent');
const errEl = document.getElementById('err');

async function generate() {
    errEl.textContent = '';
    try {
        // Fail closed: never fall back to a weak RNG
        if (typeof crypto === 'undefined' || !crypto.getRandomValues || !crypto.subtle) {
            throw new Error('Secure RNG unavailable — no seed was generated.');
        }
        const byteLen = { 12: 16, 15: 20, 18: 24, 24: 32 }[wcEl.value];
        if (!byteLen) throw new Error('Unsupported word count');

        const arr = new Uint8Array(byteLen);
        crypto.getRandomValues(arr);
        const entropyBytes = Array.from(arr);
        const words = await entropyToMnemonic(entropyBytes);
        if (words.length !== Number(wcEl.value)) throw new Error('Unexpected mnemonic length');
        for (const w of words) {
            if (!WORDLIST.includes(w)) throw new Error('Invalid word: ' + w);
        }

        grid.textContent = ''; // reset (textContent only — never innerHTML)
        words.forEach((w, i) => {
            const cell = document.createElement('div');
            cell.className = 'word';
            const num = document.createElement('b');
            num.textContent = (i + 1) + '.';
            const span = document.createElement('span');
            span.textContent = w;
            cell.append(num, span);
            grid.append(cell);
        });
        entEl.textContent = bytesToHex(entropyBytes);
    } catch (e) {
        grid.textContent = '';
        entEl.textContent = '—';
        errEl.textContent = e.message || 'Generation failed';
    }
}

document.getElementById('gen').addEventListener('click', generate);
